name: Remote resource boundaries (test branch only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay-boundaries:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
          cache-on-failure: true
      - run: npm ci
      - run: node scripts/notices.mjs
      - run: npm run build
      - name: Frozen runtime identity and resource boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path verification/remote-integration/resource-ci | Out-Null
          # Only cfg(test) code and the owned server fault fixture differ.
          git diff --exit-code 29cf53f7ac658fa5c3fe18ddc6755b9961126ab6 HEAD -- src-tauri/src/relay.rs src-tauri/src/relay_dispatch.rs src-tauri/src/lib.rs src-tauri/src/session.rs src/relay-control.ts
          if($LASTEXITCODE -ne 0){throw 'Frozen product runtime changed'}
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib relay::tests:: -- --nocapture --test-threads=1 1> verification/remote-integration/resource-ci/stdout.txt 2> verification/remote-integration/resource-ci/stderr.txt
          $testExit=$LASTEXITCODE
          @{commit='${{ github.sha }}';productCommit='29cf53f7ac658fa5c3fe18ddc6755b9961126ab6';run='${{ github.run_id }}';exitCode=$testExit;scope='Actual native relay resource mechanisms; fault injected only into owned fixture, no CLI or physical phone'} | ConvertTo-Json | Set-Content -Encoding utf8NoBOM verification/remote-integration/resource-ci/execution.json
          Get-Content -LiteralPath verification/remote-integration/resource-ci/stdout.txt
          Get-Content -LiteralPath verification/remote-integration/resource-ci/stderr.txt
          if($testExit -ne 0){throw 'Relay resource boundary test failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-resource-boundaries
          path: verification/remote-integration/resource-ci/
          if-no-files-found: error
          retention-days: 14
