{
  "name": "Diagnose suspended target drop",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native-drop-discriminator": {
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "env": {
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "RUST_TEST_THREADS": "2",
        "CARGO_TARGET_DIR": "${{ github.workspace }}/src-tauri/target"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "dtolnay/rust-toolchain@stable"
        },
        {
          "uses": "Swatinem/rust-cache@v2",
          "with": {
            "workspaces": "src-tauri",
            "shared-key": "windows",
            "cache-on-failure": true
          }
        },
        {
          "name": "Bounded exact-test sampling; stop at first failure",
          "shell": "pwsh",
          "run": "$out = Join-Path $env:RUNNER_TEMP 'drop-discriminator'\nNew-Item -ItemType Directory -Path $out -Force | Out-Null\n$testFile = 'src-tauri/vendor/portable-pty/src/win/suspended_tests.rs'\n$cargoArgs = @('test','--locked','--manifest-path','src-tauri/vendor/portable-pty/Cargo.toml','--lib','win::suspended_tests::dropping_uncommitted_launch_or_resume_token_reaps_the_real_target','--','--exact','--nocapture')\n$maxSamples = 16\n$sampleBudgetSeconds = 900\n$clock = [Diagnostics.Stopwatch]::StartNew()\n$started = [DateTime]::UtcNow.ToString('o')\n$samples = [Collections.Generic.List[object]]::new()\n$experimentExit = 0\n$stopReason = 'MAX_SAMPLES_CLEAN_NOT_REPRODUCED_NOT_A_FIX'\n$PSNativeCommandUseErrorActionPreference = $false\nfor ($sample = 0; $sample -lt $maxSamples; $sample++) {\n  if ($clock.Elapsed.TotalSeconds -ge $sampleBudgetSeconds) {\n    $experimentExit = 1\n    $stopReason = 'SAMPLE_BUDGET_EXHAUSTED'\n    break\n  }\n  $sampleOut = Join-Path $out ('sample-{0:d2}' -f $sample)\n  $fixtureTemp = Join-Path $sampleOut 'fixtures'\n  New-Item -ItemType Directory -Path $fixtureTemp -Force | Out-Null\n  $env:TEMP = $fixtureTemp\n  $env:TMP = $fixtureTemp\n  $sampleStarted = [DateTime]::UtcNow.ToString('o')\n  & cargo @cargoArgs 2>&1 | Tee-Object -FilePath (Join-Path $sampleOut 'cargo.combined.log')\n  $nativeExit = $LASTEXITCODE\n  $events = @(Get-Content -LiteralPath (Join-Path $sampleOut 'cargo.combined.log') | ForEach-Object {\n    $line = [string]$_\n    $offset = $line.IndexOf('DROP_DISCRIMINATOR ')\n    if ($offset -ge 0) { $line.Substring($offset + 'DROP_DISCRIMINATOR '.Length) }\n  })\n  $events | Set-Content -LiteralPath (Join-Path $sampleOut 'observations.jsonl') -Encoding utf8NoBOM\n  $validationError = $null\n  $classification = 'UNOBSERVED'\n  try {\n    if ($events.Count -lt 2) { throw 'Missing initial snapshot/classification' }\n    $parsed = @($events | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })\n    if (@($parsed | Where-Object { $_.kind -eq 'snapshot' -and $_.phase -eq 'initial' }).Count -ne 1) { throw 'Expected exactly one retained initial snapshot' }\n    $classes = @($parsed | Where-Object { $_.kind -eq 'classification' })\n    if ($classes.Count -ne 1) { throw 'Expected exactly one classification' }\n    $classification = $classes[0].classification\n    if ($nativeExit -eq 0 -and $classification -ne 'CLEAN_INITIAL_NOT_A_FIX_CLAIM') { throw 'Zero exit without a clean retained first observation' }\n  } catch {\n    $validationError = $_.Exception.Message\n  }\n  $result = @{sample=$sample;commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;startedAt=$sampleStarted;finishedAt=[DateTime]::UtcNow.ToString('o');argv=@('cargo')+$cargoArgs;exitCode=$nativeExit;testSourceSHA256=(Get-FileHash -LiteralPath $testFile -Algorithm SHA256).Hash.ToLowerInvariant();fixtureTemp=$fixtureTemp;eventCount=$events.Count;classification=$classification;validationError=$validationError;shippingBuild='NOT_RUN'}\n  $result | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $sampleOut 'run.json') -Encoding utf8NoBOM\n  $samples.Add($result)\n  if ($nativeExit -ne 0) {\n    $experimentExit = $nativeExit\n    $stopReason = 'FIRST_NONZERO_RETAINED'\n    break\n  }\n  if ($null -ne $validationError) {\n    $experimentExit = 1\n    $stopReason = 'INVALID_OR_MISSING_OBSERVATION'\n    break\n  }\n  if ($clock.Elapsed.TotalSeconds -ge $sampleBudgetSeconds) {\n    $experimentExit = 1\n    $stopReason = 'SAMPLE_BUDGET_EXHAUSTED'\n    break\n  }\n}\nif ($samples.Count -eq 0) {\n  $experimentExit = 1\n  $stopReason = 'ZERO_SAMPLES'\n}\n$experiment = @{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;startedAt=$started;finishedAt=[DateTime]::UtcNow.ToString('o');elapsedSeconds=$clock.Elapsed.TotalSeconds;plannedMaxSamples=$maxSamples;sampleBudgetSeconds=$sampleBudgetSeconds;jobTimeoutMinutes=20;observedSamples=$samples.Count;stopReason=$stopReason;exitCode=$experimentExit;samples=@($samples.ToArray());singleExperiment=$true;ciReruns=0;shippingBuild='NOT_RUN';fixClaim=$false}\n$experiment | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $out 'experiment.json') -Encoding utf8NoBOM\nexit $experimentExit\n"
        },
        {
          "name": "Preserve raw failure and bounded observations",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "drop-discriminator-${{ github.sha }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/drop-discriminator/",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
