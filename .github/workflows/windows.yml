name: Windows validation and package
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      updater_package:
        description: 'Create updater-signed NSIS assets (requires existing signing configuration; never publishes)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 60
    # Isolate cumulative Vite/Chromium loopback traffic on fresh runners.
    # Keep every source fixture and bundled regression, with no retries.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: source-1
            shard: 1/2
          - suite: source-2
            shard: 2/2
          - suite: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Updater manifest packaging regressions
        run: node --test scripts/rebrand.test.mjs scripts/updater-manifest.test.mjs scripts/notices.test.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - name: Resource snapshot frontend-before
        shell: pwsh
        run: |
          $sample = @{ phase = 'frontend-before'; timeUtc = [DateTime]::UtcNow.ToString('o'); processes = @(Get-Process).Count }
          try { $sample.tcp = @(Get-NetTCPConnection -ErrorAction Stop | Group-Object State | Select-Object Name, Count) } catch { $sample.measurementError = $_.Exception.Message }
          $sample | ConvertTo-Json -Depth 4 -Compress
      - name: Source module fixtures
        if: ${{ matrix.suite != 'bundled' }}
        run: npm run test:e2e -- --shard=${{ matrix.shard }}
        env:
          AGENT_GRID_SOURCE_FIXTURES_ONLY: '1'
          AGENT_GRID_NETWORK_DIAGNOSTICS: '1'
      - name: Packaged application regressions
        if: ${{ matrix.suite == 'bundled' }}
        run: npm run test:e2e
        env:
          AGENT_GRID_BUNDLED_FRONTEND_TEST: '1'
          AGENT_GRID_TEST_OUTPUT: test-results-bundled
          AGENT_GRID_NETWORK_DIAGNOSTICS: '1'
      - name: Resource snapshot frontend-after
        if: always()
        shell: pwsh
        run: |
          $sample = @{ phase = 'frontend-after'; timeUtc = [DateTime]::UtcNow.ToString('o'); processes = @(Get-Process).Count }
          try { $sample.tcp = @(Get-NetTCPConnection -ErrorAction Stop | Group-Object State | Select-Object Name, Count) } catch { $sample.measurementError = $_.Exception.Message }
          $sample | ConvertTo-Json -Depth 4 -Compress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-validation-evidence-${{ matrix.suite }}
          path: |
            test-results/
            test-results-bundled/
            artifacts/frontend-network/
          if-no-files-found: warn
          retention-days: 14
  native:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
          cache-on-failure: true
      - run: npm ci
      - run: node scripts/notices.mjs
      - run: node scripts/check-license.mjs
      - run: node --test scripts/source-integrity.test.mjs
      - run: npm run build
      - name: Resource snapshot native-before
        shell: pwsh
        run: |
          $sample = @{ phase = 'native-before'; timeUtc = [DateTime]::UtcNow.ToString('o'); processes = @(Get-Process).Count }
          try { $sample.tcp = @(Get-NetTCPConnection -ErrorAction Stop | Group-Object State | Select-Object Name, Count) } catch { $sample.measurementError = $_.Exception.Message }
          $sample | ConvertTo-Json -Depth 4 -Compress
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture
      - run: cargo test --locked --manifest-path src-tauri/vendor/portable-pty/Cargo.toml --lib -- --nocapture
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Updater native signature and launch regressions
        run: cargo test --locked --manifest-path src-tauri/vendor/tauri-plugin-updater/Cargo.toml --lib -- --nocapture
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Compile default-off actual updater helper and check its validators
        shell: pwsh
        env:
          ARCVERA_STUDIO_UPDATER_PUBLIC_KEY: ${{ vars.ARCVERA_STUDIO_UPDATER_PUBLIC_KEY || vars.OPENDIY_UPDATER_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'updater-handoff-helper'
          New-Item -ItemType Directory -Path $out | Out-Null
          $key=[Text.Encoding]::UTF8.GetBytes($env:ARCVERA_STUDIO_UPDATER_PUBLIC_KEY)
          $keySha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($key)).ToLowerInvariant()
          if($key.Length -ne 152 -or $keySha -ne 'a8c985f62b8182b7fc54d892fb36a27140c3f27e590ae5e891d42ff494b01803'){throw 'Exact existing public key required'}
          cargo build --locked --manifest-path src-tauri/Cargo.toml --features actual-updater-probe --bin updater_actual_probe --message-format=json 1> "$out/build.jsonl" 2> "$out/build.stderr.txt"
          if($LASTEXITCODE -ne 0){Get-Content -LiteralPath "$out/build.stderr.txt";throw 'Actual helper compilation failed'}
          $messages=@(Get-Content -LiteralPath "$out/build.jsonl"|ForEach-Object {$_|ConvertFrom-Json})
          $helpers=@($messages|Where-Object {$_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'updater_actual_probe' -and $_.executable})
          if($helpers.Count -ne 1){throw 'Exactly one helper artifact required'}
          Copy-Item -LiteralPath $helpers[0].executable -Destination "$out/updater_actual_probe.exe"
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features actual-updater-probe --lib desktop_updates::actual_probe::tests:: -- --nocapture --test-threads=1 1> "$out/unit.stdout.txt" 2> "$out/unit.stderr.txt"
          if($LASTEXITCODE -ne 0){Get-Content -LiteralPath "$out/unit.stdout.txt";Get-Content -LiteralPath "$out/unit.stderr.txt";throw 'Actual helper validators failed'}
          if((Get-Content -LiteralPath "$out/unit.stdout.txt" -Raw) -notmatch 'test result: ok\. 6 passed; 0 failed; 0 ignored;'){throw 'Six actual helper validator cases required'}
          @{commit='${{ github.sha }}';profile='dev';helperSHA256=(Get-FileHash -LiteralPath "$out/updater_actual_probe.exe" -Algorithm SHA256).Hash.ToLowerInvariant();publicKeySHA256=$keySha;purePass=6;actualInstall='NOT_RUN';release='NOT_RUN'}|ConvertTo-Json|Set-Content -LiteralPath "$out/compile-result.json" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-handoff-helper-${{ github.sha }}
          path: ${{ runner.temp }}/updater-handoff-helper/
          if-no-files-found: warn
          retention-days: 14
      - name: Resource snapshot native-after
        if: always()
        shell: pwsh
        run: |
          $sample = @{ phase = 'native-after'; timeUtc = [DateTime]::UtcNow.ToString('o'); processes = @(Get-Process).Count }
          try { $sample.tcp = @(Get-NetTCPConnection -ErrorAction Stop | Group-Object State | Select-Object Name, Count) } catch { $sample.measurementError = $_.Exception.Message }
          $sample | ConvertTo-Json -Depth 4 -Compress
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-probe-executable
          path: |
            src-tauri/target/debug/arcvera-studio.exe
            src-tauri/target/debug/deps/arcvera_studio_lib-*.exe
          if-no-files-found: warn
          retention-days: 14
  windows:
    needs: [frontend, native]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 2
    steps:
      # Preserve the existing required windows check: neither failed nor
      # skipped validation may permit packaging.
      - name: Require both validation jobs
        if: ${{ needs.frontend.result != 'success' || needs.native.result != 'success' }}
        run: throw 'Frontend and native validation must both succeed'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows
          cache-on-failure: true
      - run: npm ci
      - run: node scripts/notices.mjs
      - run: node scripts/check-license.mjs
      - name: Package exact Corresponding Source
        run: node scripts/package-source.mjs artifacts
      - name: Prepare verified official NSIS tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((node -p "require('./node_modules/@tauri-apps/cli/package.json').version") -ne '2.12.4') { throw 'Review pinned NSIS tools when Tauri CLI changes' }
          $download = Join-Path $env:RUNNER_TEMP 'opendiy-nsis-2.12.4'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download nsis-3.13 --repo tauri-apps/binary-releases --pattern nsis-3.13.zip --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Official NSIS download failed' }
          gh release download nsis_tauri_utils-v0.5.3 --repo tauri-apps/nsis-tauri-utils --pattern nsis_tauri_utils.dll --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Official Tauri NSIS plugin download failed' }
          $archive = Join-Path $download 'nsis-3.13.zip'
          $plugin = Join-Path $download 'nsis_tauri_utils.dll'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8' -or
              (Get-FileHash -LiteralPath $archive -Algorithm SHA1).Hash -ne 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E') { throw 'NSIS archive hash mismatch' }
          if ((Get-FileHash -LiteralPath $plugin -Algorithm SHA256).Hash -ne '5BA143B5DB4A87D32D6E7802E033330AAE56CBCEABE0D1E3BA41948385AD4709' -or
              (Get-FileHash -LiteralPath $plugin -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') { throw 'Tauri NSIS plugin hash mismatch' }
          # Same artifacts and layout as tauri-cli-v2.12.4's NSIS bundler;
          # Tauri still performs its own required-file and hash verification.
          Expand-Archive -LiteralPath $archive -DestinationPath $download
          $cache = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $cache 'NSIS'
          if (Test-Path -LiteralPath $nsis) { throw 'Unexpected existing NSIS cache; refusing to overwrite it' }
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $download 'nsis-3.13') -Destination $nsis -Recurse
          $plugins = Join-Path $nsis 'Plugins/x86-unicode/additional'
          New-Item -ItemType Directory -Path $plugins -Force | Out-Null
          Copy-Item -LiteralPath $plugin -Destination (Join-Path $plugins 'nsis_tauri_utils.dll')
      - name: Build ordinary Windows package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.updater_package }}
        run: npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --bundles nsis
      - name: Build updater-signed Windows package
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.updater_package }}
        shell: pwsh
        env:
          ARCVERA_STUDIO_UPDATER_PUBLIC_KEY: ${{ vars.ARCVERA_STUDIO_UPDATER_PUBLIC_KEY || vars.OPENDIY_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARCVERA_STUDIO_UPDATER_PUBLIC_KEY)) { throw 'Set repository variable ARCVERA_STUDIO_UPDATER_PUBLIC_KEY (or the existing OPENDIY_UPDATER_PUBLIC_KEY) before requesting updater packaging' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Set repository secret TAURI_SIGNING_PRIVATE_KEY before requesting updater packaging' }
          # Only the public key is written to the temporary config; private material stays in the runner environment.
          $updaterConfig = Join-Path $env:RUNNER_TEMP 'arcvera-updater-public.json'
          @{ bundle = @{ createUpdaterArtifacts = $true }; plugins = @{ updater = @{ pubkey = $env:ARCVERA_STUDIO_UPDATER_PUBLIC_KEY.Trim() } } } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM -LiteralPath $updaterConfig
          & npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --config $updaterConfig --bundles nsis 2>&1 | Tee-Object -Variable updaterBuildLog
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { exit $buildExit }
          # Tauri 2.12.4 warns on a mismatched key pair; this packaging mode must fail instead.
          if (($updaterBuildLog -join "`n").Contains('does not match the public key')) { throw 'Updater signing key pair does not match; no updater assets will be prepared' }
      - name: NSIS shortcut preservation and mutation sensitivity
        run: node scripts/installer-shortcut-sensitivity.mjs
      - name: External Microsoft runtime policy and NSIS prerequisite boundaries
        run: node --test scripts/external-runtime.test.mjs
      - name: Preserve rendered installer runtime policy
        shell: pwsh
        run: |
          $rendered = 'src-tauri/target/release/nsis/x64/installer.nsi'
          if (!(Test-Path -LiteralPath $rendered -PathType Leaf)) { throw 'Rendered NSIS script required' }
          $script = Get-Content -LiteralPath $rendered -Raw
          if ($script -match 'NSISdl::download|MicrosoftEdgeWebview2Setup|MicrosoftEdgeWebView2RuntimeInstaller|ExecWait[^\r\n]*appguid=') { throw 'Microsoft runtime acquisition in rendered installer' }
          if ($script -notmatch 'Call ArcveraRequireWebView2') { throw 'Rendered prerequisite gate required' }
          New-Item -ItemType Directory -Path artifacts/external-runtime/rendered -Force | Out-Null
          Copy-Item -LiteralPath $rendered -Destination artifacts/external-runtime/rendered/installer.nsi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-shortcut-evidence
          path: artifacts/installer-shortcuts/
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare portable executable and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item src-tauri/target/release/arcvera-studio.exe artifacts/arcvera-studio.exe
          $gridVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "artifacts/Arcvera-Studio-$gridVersion-windows-x64-setup.exe"
          Copy-Item LICENSE artifacts/
          Copy-Item LICENSE-MIT-LEGACY artifacts/
          Copy-Item SOURCE.md artifacts/
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/
          Copy-Item src-tauri/installer/RUNTIME.md artifacts/
          Copy-Item src-tauri/installer/RUNTIME.ko.md artifacts/
          Copy-Item src-tauri/Cargo.lock artifacts/Cargo.lock
          @{ commit = '${{ github.sha }}'; run = '${{ github.run_id }}'; platform = 'windows-x64'; signed = $false; license = 'AGPL-3.0-or-later'; sourceArchive = "arcvera-studio-$gridVersion-source.zip" } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM artifacts/build-info.json
          Compress-Archive -Path artifacts/arcvera-studio.exe,artifacts/LICENSE,artifacts/LICENSE-MIT-LEGACY,artifacts/SOURCE.md,artifacts/THIRD_PARTY_NOTICES.md,artifacts/RUNTIME.md,artifacts/RUNTIME.ko.md,artifacts/build-info.json -DestinationPath "artifacts/arcvera-studio-$gridVersion-windows-x64-portable.zip"
          $probeExe = (Resolve-Path 'artifacts/arcvera-studio.exe').Path
          $probeReport = Join-Path $PWD 'artifacts/self-test.json'
          $probeArgs = @('--self-test','--duration-seconds','60','--report',('"{0}"' -f $probeReport))
          $probeStarted = [DateTime]::UtcNow.ToString('o')
          $probeExit = $null
          $probeLaunchError = $null
          $probeExeSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $probeExe).Hash.ToLowerInvariant()
          try {
            $probe = Start-Process -FilePath $probeExe -ArgumentList $probeArgs -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "$PWD/artifacts/self-test.stdout.txt" -RedirectStandardError "$PWD/artifacts/self-test.stderr.txt"
            $probeExit = $probe.ExitCode
          } catch {
            $probeLaunchError = $_.Exception.Message
            throw
          } finally {
            $probeEvidence = @{
              commit = '${{ github.sha }}'; run = '${{ github.run_id }}'
              executable = $probeExe; executableSha256 = $probeExeSha
              arguments = $probeArgs; startedAtUtc = $probeStarted; finishedAtUtc = [DateTime]::UtcNow.ToString('o')
              exitCode = $probeExit; launchError = $probeLaunchError
              reportExists = Test-Path -LiteralPath $probeReport -PathType Leaf
            }
            if ($probeEvidence.reportExists) {
              $probeEvidence.reportBytes = (Get-Item -LiteralPath $probeReport).Length
              $probeEvidence.reportSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $probeReport).Hash.ToLowerInvariant()
            }
            $probeEvidence | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM artifacts/self-test-execution.json
          }
          if ($probeExit -ne 0) { throw "Packaged PTY self-test failed: $probeExit" }
          Get-ChildItem artifacts -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name } | Set-Content -Encoding utf8NoBOM artifacts/SHA256SUMS.txt
      - name: Prepare updater assets without publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.updater_package }}
        run: node scripts/updater-manifest.mjs src-tauri/target/release/bundle/nsis artifacts/updater
      - uses: actions/upload-artifact@v4
        with:
          name: arcvera-studio-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve packaged PTY self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-pty-self-test-evidence
          path: |
            artifacts/self-test.json
            artifacts/self-test.stdout.txt
            artifacts/self-test.stderr.txt
            artifacts/self-test-execution.json
          if-no-files-found: warn
          retention-days: 14
