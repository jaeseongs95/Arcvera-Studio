{
  "name": "Build ignored native update HTTPS diagnostic",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native-update-network-probe": {
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "env": {
        "CARGO_BUILD_JOBS": "2",
        "CARGO_INCREMENTAL": "0",
        "RUST_TEST_THREADS": "2",
        "CARGO_TARGET_DIR": "${{ github.workspace }}/src-tauri/target"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "dtolnay/rust-toolchain@stable"
        },
        {
          "uses": "Swatinem/rust-cache@v2",
          "with": {
            "workspaces": "src-tauri",
            "shared-key": "windows",
            "cache-on-failure": true
          }
        },
        {
          "run": "npm ci"
        },
        {
          "run": "node scripts/notices.mjs"
        },
        {
          "run": "npm run build"
        },
        {
          "name": "Compile only the native library test executable",
          "shell": "pwsh",
          "run": "$ErrorActionPreference = 'Stop'\n$PSNativeCommandUseErrorActionPreference = $false\n$out = Join-Path $env:RUNNER_TEMP 'update-network-probe'\nNew-Item -ItemType Directory -Path $out | Out-Null\ncargo test --locked --manifest-path src-tauri/Cargo.toml --no-run --lib --message-format=json 1> \"$out/build.jsonl\" 2> \"$out/build.stderr.txt\"\nif ($LASTEXITCODE -ne 0) { Get-Content -LiteralPath \"$out/build.stderr.txt\"; throw 'Native test EXE compilation failed' }\n$artifacts = @(Get-Content -LiteralPath \"$out/build.jsonl\" | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop } | Where-Object {\n  $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'agent_grid_lib' -and\n  $_.profile.test -eq $true -and $_.executable -and $_.executable.EndsWith('.exe')\n})\nif ($artifacts.Count -ne 1) { throw 'Exactly one agent_grid_lib test executable required' }\nCopy-Item -LiteralPath $artifacts[0].executable -Destination \"$out/updater-network-probe.exe\"\n@{commit=$env:GITHUB_SHA;run=$env:GITHUB_RUN_ID;sourceSHA256=(Get-FileHash -LiteralPath 'src-tauri/src/desktop_updates.rs' -Algorithm SHA256).Hash.ToLowerInvariant();testEXESHA256=(Get-FileHash -LiteralPath \"$out/updater-network-probe.exe\" -Algorithm SHA256).Hash.ToLowerInvariant();compiledOnly=$true;testExecuted=$false;productBuild=$false} | ConvertTo-Json -Compress"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "updater-network-probe-${{ github.sha }}",
            "path": "${{ runner.temp }}/update-network-probe/updater-network-probe.exe",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
