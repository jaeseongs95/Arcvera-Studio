name: Isolated native CLI startup
on:
  push:
    branches: [feat/181-native-cli]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Obtain pinned test dependency in disposable workspace
        run: npm install --prefix artifacts/cli-dependency --ignore-scripts --no-audit --no-fund @openai/codex@0.166.0
      - name: Observe actual startup without authentication
        run: ./scripts/observe-native-cli.ps1
      - name: Preserve complete and partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/native-cli/observation.json
            artifacts/native-cli/smoke.json
            artifacts/native-cli/*.stdout.txt
            artifacts/native-cli/*.stderr.txt
          if-no-files-found: error
          retention-days: 14
