[package]
name = "arcvera-studio"
version = "2.0.0"
description = "Independent terminal workspace for local coding agents"
authors = ["Arcvera-Studio contributors"]
license = "AGPL-3.0-or-later"
edition = "2021"
default-run = "arcvera-studio"

[[bin]]
name = "arcvera-studio"
path = "src/main.rs"

[[bin]]
name = "updater_actual_probe"
path = "src/bin/updater_actual_probe.rs"
required-features = ["actual-updater-probe"]

[features]
# Explicit TEST component only, excluded from product builds.
actual-updater-probe = ["tauri/test"]

[lib]
name = "arcvera_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.28"
sha2 = "0.10"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "=2.14.1"
# Reuse the updater's HTTP stack for capped native metadata/artifact reads.
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
semver = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
