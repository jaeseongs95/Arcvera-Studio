[package]
name = "opendiy-desktop"
version = "1.3.2"
description = "Independent terminal workspace for local coding agents"
authors = ["OpenDIY Desktop contributors"]
license = "MIT"
edition = "2021"
default-run = "opendiy-desktop"

[[bin]]
name = "opendiy-desktop"
path = "src/main.rs"

[lib]
name = "agent_grid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tungstenite = "0.28"
sha2 = "0.10"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
